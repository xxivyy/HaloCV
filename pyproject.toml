[project]
name = "halocv"
version = "0.1.0"
description = "A modular computer vision framework for efficient real-time object detection, tracking, and visual content moderation."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.3",
    "onnxruntime-gpu>=1.30.0",
    "opencv-python>=5.0.0.93",
    "torch>=2.14.1",
]


[project.optional-dependencies]
server = [
    "fastapi>=0.141.1",
    "numpy>=2.5.3",
    "uvicorn>=0.54.0",
]
desktop = [
    "dxcam>=0.3.0",
    "opencv-python>=5.0.0.93",
    "pyside6>=6.11.2",
    "websockets>=17.1",
]


[dependency-groups]
dev = [
    "ruff>=0.16.9",
    "ty>=0.0.84",
]


[tool.uv.sources]
torch = [
    { index = "torch-cu132" },
]


[[tool.uv.index]]
name = "torch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true
