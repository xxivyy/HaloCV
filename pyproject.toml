[project]
name = "halocv"
version = "0.1.0"
description = "A modular computer vision framework for efficient real-time object detection, tracking, and visual content moderation."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dxcam>=0.3.0",
    "fastapi>=0.141.1",
    "numpy>=2.5.3",
    "opencv-python>=5.0.0.93",
    "pyside6>=6.11.2",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
    "ultralytics>=8.4.165",
    "uvicorn>=0.54.0",
    "websockets>=17.1",
]


[dependency-groups]
dev = [
    "ruff>=0.16.9",
    "ty>=0.0.84",
]


[tool.uv.sources]
torch = [
    { index = "torch-gpu" },
]
torchvision = [
    { index = "torch-gpu" },
]


[[tool.uv.index]]
name = "torch-gpu"
url = "https://download.pytorch.org/whl/cu132"
explicit = true
